name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: supportpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d supportpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/app ml/src
      - run: uv run alembic -c apps/api/alembic.ini upgrade head
      - run: uv run alembic -c apps/api/alembic.ini check
      - run: uv run pytest
        env:
          RUN_DB_TESTS: '1'
