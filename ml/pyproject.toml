[project]
name = "supportpilot-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []
[project.optional-dependencies]
training = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "mlflow>=2.22,<4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/supportpilot_ml"]
